# .github/workflows/codeql.yml

name: "CodeQL SAST"

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL - ${{ matrix.language }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Initialize CodeQL
      # --------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # 4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # --------------------------------------------------
      # 3. Build application
      # --------------------------------------------------
      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # 4.37.6

      # --------------------------------------------------
      # 4. Run CodeQL SAST analysis
      # --------------------------------------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # 4.37.6
        with:
          category: "/language:${{ matrix.language }}"
